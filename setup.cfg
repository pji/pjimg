[pycodestyle]
ignore = E231,W503


[precommit]
doctest_modules = pjimg.sources.patterns
    pjimg.blends.ops
    pjimg.eases.ops
    pjimg.filters.affine
    pjimg.filters.blurs
    pjimg.filters.distort
    pjimg.filters.value
python_files = *
    src/pjimg/*
    src/pjimg/blends/*
    src/pjimg/eases/*
    src/pjimg/filters/*
    src/pjimg/imgio/*
    src/pjimg/sources/*
    src/pjimg/util/*
    examples/*
    tests/*
    tests/test_blends/*
    tests/test_eases/*
    tests/test_filters/*
    tests/test_imgio/*
    tests/test_sources/*
    tests/test_util/*
rst_files = *
    docs/*
unit_tests = tests


[tox:tox]
envlist = lint, py311, py312, py313


[testenv]
commands =
	python -m pytest tests/test_util --capture=fd --import-mode importlib
	python -m pytest tests/test_imgio --capture=fd --import-mode importlib
	python -m pytest tests/test_sources --capture=fd --import-mode importlib
	python -m pytest tests/test_filters --capture=fd --import-mode importlib
	python -m pytest tests/test_eases --capture=fd --import-mode importlib
	python -m pytest tests/test_blends --capture=fd --import-mode importlib
deps = -rrequirements.txt
    pytest
    pytest-mock


[testenv:lint]
allowlist_externals = isort, mypy, poetry, pycodestyle, rstcheck
commands = 
    isort ./src/pjimg --check-only --diff --skip .tox --lai 2 -m 3
    isort ./tests --check-only --diff --skip .tox --lai 2 -m 3
    mypy src/
    rstcheck -r src/
    rstcheck -r docs/source/
    pycodestyle src/
    pycodestyle tests/
    poetry export -f requirements.txt --without-hashes --output requirements.txt
deps = -rrequirements.txt
    isort
    mypy
    rstcheck
    poetry
    pycodestyle
    sphinx
